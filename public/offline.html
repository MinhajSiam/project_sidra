<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0f19">
    <title>Offline - Sidra</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0b0f19;
            color: #f8fafc;
            font: 16px system-ui, sans-serif;
            text-align: center;
        }

        main {
            max-width: 320px;
            padding: 24px;
        }

        h1 {
            font-size: 28px;
            margin: 16px 0 8px;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 18px;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main>
        <img src="/assets/images/pwa-icon.svg" width="64" height="64" alt="Sidra">
        <h1>You are offline</h1>
        <p>Previously opened tickets remain available from your saved ticket links. Reconnect to browse events or make a
            purchase.</p>
        <a href="/customer/tickets">Open My Tickets</a>
    </main>
</body>

</html>
